version: 2
updates:
  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # Backend (pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # Docker images: backend, frontend, auth (Keycloak), postgis
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/auth"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/postgis"
    schedule:
      interval: "weekly"

  # docker-compose base images (nginx, postgres, certbot) pinned at the root
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # GitHub Actions workflows (none yet, kept ready for when CI is added)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
