# nginx configuration for Hornet Finder DEV - App
server {
    listen 80;
    server_name dev.velutina.ovh;

    # Permanent redirection to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.velutina.ovh;

    ssl_certificate /etc/letsencrypt/live/dev.velutina.ovh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.velutina.ovh/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-CCM:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve prime256v1:X25519:secp384r1;

    # Room for the /mail/ session cookie sent back by the browser
    large_client_header_buffers 4 32k;

    location = /robots.txt {
        proxy_pass http://hornet-finder-dev-api:8000/robots.txt;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  X-Content-Type-Options;
        proxy_hide_header  Referrer-Policy;
        include /etc/nginx/include/security-headers.conf;
    }

    # Proxy for Vite frontend in development mode
    location / {
        proxy_pass http://hornet-finder-dev-vite:5173/;

        # Handle WebSocket connections for HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/include/security-headers-dev.conf;
    }

    # Proxy for Django backend DEV
    location /api/ {
        proxy_pass http://hornet-finder-dev-api:8000/api/;

        # Photo uploads (resized client-side, capped server-side by Django)
        client_max_body_size 25m;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  X-Content-Type-Options;
        proxy_hide_header  Referrer-Policy;
        include /etc/nginx/include/security-headers-dev.conf;
    }

    # User-uploaded media (trap photos). Never reachable directly: Django
    # checks the permissions and answers with X-Accel-Redirect: /_media/<path>.
    location /_media/ {
        internal;
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "private, max-age=2592000";
    }

    # Catch-all mailbox (Mailpit), DEV only, gated by oauth2-proxy (Keycloak
    # SSO or bearer token, realm role mail-reader required).
    location /mail/oauth2/ {
        # The session cookie carries the Keycloak tokens (several KB)
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_pass http://hornet-finder-dev-mail-proxy:4180;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    location = /mail/oauth2/auth {
        internal;
        # The session cookie carries the Keycloak tokens (several KB)
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_pass http://hornet-finder-dev-mail-proxy:4180;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    location @mail_login {
        # Browsers go to the Keycloak login; API clients just get the 401.
        if ($http_authorization) {
            return 401;
        }
        return 302 /mail/oauth2/start?rd=$request_uri;
    }

    location /mail/ {
        auth_request /mail/oauth2/auth;
        error_page 401 = @mail_login;

        proxy_pass http://hornet-finder-dev-mailpit:8025;
        # Live updates (websocket on /mail/api/events)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization "";
        # Back link to the app, injected into the Mailpit UI shell only (the
        # installed PWA has no back button). Uncompressed so sub_filter sees it.
        proxy_set_header Accept-Encoding "";
        sub_filter '<script src="/mail/dist/app.js' '<a href="/admin" style="position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:2000;padding:6px 12px;border-radius:999px;background:#212529;color:#fff;font:14px system-ui,sans-serif;text-decoration:none;opacity:.85">&larr; Velutina</a><script src="/mail/dist/app.js';
        sub_filter_once on;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mailpit sets its own CSP (HTML preview iframe): do not stack ours.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # Proxy Django static files (including Swagger UI assets) via Django DEV
    location /static/ {
        proxy_pass http://hornet-finder-dev-api:8000/static/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # No cache in DEV for easier debugging
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/include/security-headers-dev.conf;
    }
}
