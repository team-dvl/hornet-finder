<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Fond de l’écran d’accueil -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1f1b16">
    <meta name="color-scheme" content="light dark">
    <!-- Page background before the stylesheet arrives (--app-bg of styles/theme.css, keep in step) -->
    <style>
      html { background: #f6f3ee; color-scheme: light; }
      html[data-bs-theme='dark'] { background: #14110d; color-scheme: dark; }
      html[data-theme='foret'] { background: #f1f5ef; }
      html[data-theme='foret'][data-bs-theme='dark'] { background: #0f1612; }
    </style>
    <!-- Look (palette + mode) applied before the first paint; same rules as src/utils/theme.ts -->
    <script>
      (function () {
        var r = document.documentElement, p = 'velutina', m = 'auto';
        try {
          p = localStorage.getItem('theme.palette') || p;
          m = localStorage.getItem('theme.mode') || m;
        } catch (e) {}
        if (p !== 'velutina' && p !== 'foret') p = 'velutina';
        if (m !== 'light' && m !== 'dark') m = 'auto';
        var dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        r.dataset.theme = p;
        r.dataset.bsTheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content',
          { velutina: ['#1f1b16', '#0d0b08'], foret: ['#17402f', '#0a100d'] }[p][dark ? 1 : 0]);
      })();
    </script>
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Velutina - Application de suivi et de localisation des frelons asiatiques, nids et ruchers. Outil collaboratif pour la lutte contre Vespa velutina." />
    <title>Velutina</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
