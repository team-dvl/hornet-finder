name: hornet-finder-dev

services:
  # Service pour générer les certificats SSL DEV
  certbot-dev:
    image: certbot/certbot:v5.1.0
    volumes:
      - ./certbot-dev/conf:/etc/letsencrypt
      - ./certbot-dev/www:/var/www/certbot
    entrypoint:
      sh -c "certbot certonly --webroot --webroot-path=/var/www/certbot --email vlb79rzxd@relay.firefox.com --agree-tos --no-eff-email --non-interactive --expand --force-renewal -d dev.velutina.ovh -d auth.dev.velutina.ovh"
    depends_on:
      - nginx-certbot-dev
    profiles:
      - gencert

  nginx-certbot-dev:
    image: nginx:1.29.0
    container_name: hornet-finder-dev-nginx-certbot
    ports:
      - "${BIND_IP:-0.0.0.0}:${PROXY_PORT:-80}:80"  # Port 80 required for ACME challenges
    volumes:
      - ./nginx/conf.d/certbot-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot-dev/conf:/etc/letsencrypt:ro
      - ./certbot-dev/www:/var/www/certbot
    profiles:
      - gencert

  # Base de données PostGIS pour DEV
  hornet-finder-dev-api-db:
    build: ./postgis
    container_name: hornet-finder-dev-api-db
    environment:
      - POSTGRES_DB=hornet_finder_dev
      - POSTGRES_USER=hornet_finder_dev
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - dev-api-db:/var/lib/postgresql

  # API Django pour DEV
  hornet-finder-dev-api:
    build: ./backend
    container_name: hornet-finder-dev-api
    image: hornet-finder-dev-api
    environment:
      - DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - HOST=dev.velutina.ovh
      - DB_HOST=hornet-finder-dev-api-db
      - DB_NAME=hornet_finder_dev
      - DB_USER=hornet_finder_dev
      - DB_PASSWORD=${DB_PASSWORD}
      - KC_CLIENT_ID=${KC_CLIENT_ID}
      - KC_CLIENT_SECRET=${KC_CLIENT_SECRET}
      - TAG_HMAC_KEYS=${TAG_HMAC_KEYS}
      - TAG_HMAC_ACTIVE_INDEX=${TAG_HMAC_ACTIVE_INDEX}
      - TAG_SITE_ID=${TAG_SITE_ID}
      - KC_INTERNAL_URL=http://hornet-finder-dev-keycloak:8080/
      - KC_REALM=hornet-finder-dev
      - EMAIL_HOST=hornet-finder-dev-mailpit
      - EMAIL_PORT=1025
    volumes:
      - dev-media:/app/media
    depends_on:
      - hornet-finder-dev-api-db
      - hornet-finder-dev-keycloak

  # Database Keycloak pour DEV
  hornet-finder-dev-keycloak-db:
    image: postgres:18.6
    container_name: hornet-finder-dev-keycloak-db
    environment:
      - POSTGRES_DB=keycloak_dev
      - POSTGRES_USER=keycloak_dev
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    volumes:
      - dev-keycloak-db:/var/lib/postgresql

  # Keycloak pour DEV
  hornet-finder-dev-keycloak:
    build: ./auth
    container_name: hornet-finder-dev-keycloak
    image: hornet-finder-dev-keycloak
    environment:
      - KC_DB_URL=jdbc:postgresql://hornet-finder-dev-keycloak-db/keycloak_dev
      - KC_DB_USERNAME=keycloak_dev
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - ./auth/realm-export-dev.json:/opt/keycloak/data/import/realm-export.json
      - ./auth/docker-entrypoint-dev.sh:/opt/keycloak/docker-entrypoint.sh
    depends_on:
      - hornet-finder-dev-keycloak-db

  # Nginx pour DEV
  nginx:
    image: nginx:1.29.0
    container_name: hornet-finder-dev-nginx
    ports:
      - "${BIND_IP:-0.0.0.0}:${PROXY_PORT:-80}:80"
      - "${BIND_IP:-0.0.0.0}:${PROXY_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d/auth-dev.conf:/etc/nginx/conf.d/auth-dev.conf:ro
      - ./nginx/conf.d/app-dev.conf:/etc/nginx/conf.d/app-dev.conf:ro
      - ./nginx/include/security-headers.conf:/etc/nginx/include/security-headers.conf:ro
      - ./nginx/include/security-headers-dev.conf:/etc/nginx/include/security-headers-dev.conf:ro
      - ./certbot-dev/conf:/etc/letsencrypt:ro
      - ./certbot-dev/www:/var/www/certbot
      - dev-media:/srv/media:ro
    depends_on:
      - hornet-finder-dev-api
      - hornet-finder-dev-keycloak
      - hornet-finder-dev-vite
      - hornet-finder-dev-mailpit
      - hornet-finder-dev-mail-proxy

  # Catch-all mailbox for DEV: every email sent by Keycloak or Django lands
  # here and is never relayed. Storage is ephemeral (no volume). UI and REST
  # API are served under https://dev.velutina.ovh/mail/, behind the proxy below.
  hornet-finder-dev-mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: hornet-finder-dev-mailpit
    environment:
      - MP_WEBROOT=/mail/
      - MP_MAX_MESSAGES=500
      - MP_ALLOWED_HOSTS=dev.velutina.ovh
      - MP_LABEL=Velutina DEV

  # SSO gate in front of Mailpit (nginx auth_request). Browsers log in through
  # Keycloak; scripts send a Keycloak bearer token. Both need the realm role
  # mail-reader. Token redemption and JWKS go through the internal Keycloak URL.
  hornet-finder-dev-mail-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    container_name: hornet-finder-dev-mail-proxy
    environment:
      - OAUTH2_PROXY_PROVIDER=keycloak-oidc
      - OAUTH2_PROXY_CLIENT_ID=mail-proxy-dev
      - OAUTH2_PROXY_CLIENT_SECRET=${MAIL_PROXY_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${MAIL_PROXY_COOKIE_SECRET}
      - OAUTH2_PROXY_COOKIE_NAME=_mail_proxy
      - OAUTH2_PROXY_COOKIE_PATH=/mail
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
      - OAUTH2_PROXY_PROXY_PREFIX=/mail/oauth2
      - OAUTH2_PROXY_REDIRECT_URL=https://dev.velutina.ovh/mail/oauth2/callback
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://auth.dev.velutina.ovh/realms/hornet-finder-dev
      - OAUTH2_PROXY_SKIP_OIDC_DISCOVERY=true
      - OAUTH2_PROXY_LOGIN_URL=https://auth.dev.velutina.ovh/realms/hornet-finder-dev/protocol/openid-connect/auth
      - OAUTH2_PROXY_REDEEM_URL=http://hornet-finder-dev-keycloak:8080/realms/hornet-finder-dev/protocol/openid-connect/token
      - OAUTH2_PROXY_OIDC_JWKS_URL=http://hornet-finder-dev-keycloak:8080/realms/hornet-finder-dev/protocol/openid-connect/certs
      - OAUTH2_PROXY_CODE_CHALLENGE_METHOD=S256
      # The realm signs with PS256; without discovery only RS256 is expected.
      - OAUTH2_PROXY_OIDC_ENABLED_SIGNING_ALGS=PS256,RS256
      - OAUTH2_PROXY_ALLOWED_ROLES=mail-reader
      - OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS=true
      # Service accounts carry no email: identify everyone by username.
      - OAUTH2_PROXY_OIDC_EMAIL_CLAIM=preferred_username
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL=true
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_UPSTREAMS=static://202
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
    depends_on:
      - hornet-finder-dev-keycloak

  # Serveur Vite pour DEV
  hornet-finder-dev-vite:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hornet-finder-dev-vite
    environment:
      # URLs pour le développement - utiliser les vrais services
      - VITE_API_URL=https://dev.velutina.ovh/api/
      - VITE_KEYCLOAK_URL=https://auth.dev.velutina.ovh/
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - hornet-finder-dev-api
      - hornet-finder-dev-keycloak
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  dev-api-db:
  dev-keycloak-db:
  dev-media:

networks:
  default:
    name: hornet-finder-dev-network
    driver: bridge
